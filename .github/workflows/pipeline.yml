name: Refresh FPL data

on:
  schedule:
    # Baseline: every 3 hours, covering everything outside the matchday
    # windows below (overnight, midweek daytime, off-season).
    - cron: '0 */3 * * *'
    # FPL has no webhook for "a fixture just finished", so this is a bounded
    # poll standing in for one: every 15 minutes across the windows PL
    # fixtures actually kick off in (UTC), so a finished match is picked up
    # (and, per the no-op commit step below, only actually committed/
    # redeployed) within 15 minutes rather than waiting up to 3 hours.
    # Fri-Mon covers the weekend program plus Friday-night and Monday-Night
    # Football; Tue-Thu covers rearranged/cup-adjacent midweek fixtures.
    - cron: '*/15 10-22 * * 5,6,0,1'
    - cron: '*/15 17-22 * * 2,3,4'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-fpl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Run prediction pipeline
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: python -m engine.pipeline

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "fpl-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh FPL data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages redeploy
        # A GITHUB_TOKEN push doesn't trigger other workflows' `on: push`
        # (GitHub's anti-recursion safeguard), so the data commit above
        # wouldn't otherwise cause a redeploy. Dispatch it explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
