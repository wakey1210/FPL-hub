name: Refresh FPL data

on:
  schedule:
    # Every 3 hours. The FPL API has no published rate limit and community
    # tooling reports it tolerates far heavier use, so a fixed cadence is
    # simpler and just as fresh near deadlines as a special-cased schedule.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-fpl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Run prediction pipeline
        run: python -m engine.pipeline

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "fpl-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh FPL data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages redeploy
        # A GITHUB_TOKEN push doesn't trigger other workflows' `on: push`
        # (GitHub's anti-recursion safeguard), so the data commit above
        # wouldn't otherwise cause a redeploy. Dispatch it explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
