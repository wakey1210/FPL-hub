name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build PWA
        working-directory: app
        run: npm run build

      - name: Ensure engine data is bundled
        # Belt-and-braces: app/public/data is a symlink to ../../data, which
        # Vite's publicDir copy should already follow, but a CI checkout can
        # behave differently - an explicit copy guarantees it either way.
        run: |
          mkdir -p app/dist/data
          cp -r data/. app/dist/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
